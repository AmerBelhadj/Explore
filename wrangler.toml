name = "jerbi-worker"
main = "jerbi-worker.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "JERBI_KV"
id = "5d9506ac842a420697c17366ea9ee065"

# Cron : nettoyage + recherche événements chaque nuit à 1h00 UTC (= 2h Tunis)
# Pour changer l'heure : modifier "0 1 * * *"
#   "0 2 * * *"  = 2h UTC = 3h Tunis
#   "0 23 * * *" = 23h UTC = 0h Tunis
[[triggers]]
crons = ["0 1 * * *"]

# Variables sensibles : NE PAS mettre ici, utiliser le Dashboard
# Workers > jerbi-worker > Settings > Variables
# ┌─────────────────────────────────────────────────────────┐
# │  ADMIN_SECRET     : clé secrète admin (Secret)          │
# │  GITHUB_PAT       : token GitHub public_repo (Secret)   │
# │  GITHUB_OWNER     : amerbelhadj (Text)                  │
# │  GITHUB_REPO      : Explore (Text)                      │
# │  WHATSAPP_NUMBER  : ex. 21698765432 (Text) — optionnel  │
# │  WHATSAPP_TOKEN   : token WA Business API (Secret) opt. │
# │  WHATSAPP_PHONE_ID: ID téléphone WA Business (Text) opt.│
# └─────────────────────────────────────────────────────────┘
